<!-- From https://getbootstrap.com/docs/5.3/getting-started/introduction/ -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <main>
      <!-- Navbar courtesy of devedu AI: navigation for all pages -->
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <a class="navbar-brand" href="{% url 'movie_list' %}">Movie Theater</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <!-- Added another way to navigate to the movies page to avoid confusion -->
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'movie_list' %}">Movies</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'booking_history' %}">Bookings</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'seat_booking' %}">Book a Seat</a>
              </li>
            </ul>
          </div>
        </div>
      </nav> 
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
