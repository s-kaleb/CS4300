<!-- From https://getbootstrap.com/docs/5.3/getting-started/introduction/ -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie Theater</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <main>
      <!-- Navbar courtesy of devedu AI: navigation for all pages-->
      <nav class="navbar navbar-expand navbar-light bg-light">
        <div class="container-fluid">
          
          <a class="navbar-brand" href="{% url 'movie_list' %}">Movie Theater</a>
          
          <div class="navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <!-- Added another way to navigate to the movies page to avoid confusion -->
              <li class="nav-item">
                <a class="nav-link" href="{% url 'movie_list' %}">Movies</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'booking_history' %}">Bookings</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'seat_booking' %}">Book a Seat</a>
              </li>
              {% if user.is_authenticated %}
                <!-- Used ChatGPT to fix the alignment of the logout form with the username -->
                <li class="nav-item d-flex align-items-center">
                  <!--Display the username of the authenticated user-->
                  <span class="navbar-text me-3">
                      Hi {{ user.username }}
                  </span>
                  <!-- Logout form for authenticated users -->
                  <form method="POST" action="{% url 'logout' %}" class="m-0">
                      {% csrf_token %}
                      <button type="submit" class="btn btn-outline-primary">
                          Logout
                      </button>
                  </form>
                </li>
              {% else %}
                <!-- Login link for unauthenticated users -->
                <li class="nav-item">
                <a class="nav-link" href="{% url 'login' %}">login</a>
              </li>
              {% endif %}
            </ul>
          </div>
        </div>
      </nav> 
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
