{% extends "bookings/base.html" %}

{% block content %}
	<h1>Booking History</h1>

	{% if bookings %}
		<ul>
			{% for booking in bookings %}
				<li>
					<h2>{{ booking }}</h2>
					<p>User: {{ booking.user }}</p>
				</li>
			{% endfor %}
		</ul>
	{% else %}
		<p>No seats are currently available.</p>
	{% endif %}
{% endblock %}
