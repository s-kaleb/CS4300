<!--This is the page where a user can go to book a seat-->

<!--This serves as as create page-->
<!--Created with ChatGPT prompt-->

{% extends "bookings/base.html" %}

{% block content %}

<div class="container mt-5">

    <h1 class="mb-4">Book a Seat</h1>

	<!-- Display an error message if the booking fails Devedu AI-->
    {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
		<!-- cross site request forgery protection -->
        {% csrf_token %}

        <!-- Movie -->
        <div class="mb-3">
            <label for="movie" class="form-label">Select a movie</label>

            <select name="movie" id="movie" class="form-select">
                <option value="">Choose a movie...</option>

                {% for movie in movies %}
                    <option value="{{ movie.id }}">
                    	{{ movie.title }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Seat -->
        <div class="mb-3">
            <label for="seat" class="form-label">Select a seat</label>

            <select name="seat" id="seat" class="form-select">
                <option value="">Choose a seat...</option>

                {% for seat in seats %}
                    {% if not seat.booking_status %}
                        <option value="{{ seat.id }}">
                            Seat {{ seat.seat_number }}
                        </option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>

        <!-- Date -->
        <div class="mb-3">
            <label for="booking_date" class="form-label">
                Booking date
            </label>

            <input
                type="date"
                name="booking_date"
                id="booking_date"
                class="form-control"
            >
        </div>
		<!-- type = submit to submit the form enteres the views.py loop to save data to db-->
        <button type="submit" class="btn btn-primary">
            Book Seat
        </button>


    </form>

</div>

{% endblock %}
